name: Nightly (Beta)

# The beta channel is a manually requested build of
# tip of main and publish it as the next patch of the latest stable +
# "-beta.N" (stable 1.2.3 -> 1.2.4-beta.N, so nightlies version-sort above
# the stable they follow) — a real tag plus a GitHub pre-release
# (pre-releases are never "Latest"). Stable releases are dispatched manually
# (see release.yml). Scheduled unsigned releases are intentionally disabled.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize against release.yml. A new publish waits instead of cancelling an
# in-flight release.
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  version:
    name: Compute beta version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute beta version
        id: compute
        run: bash scripts/ci/compute_version.sh beta

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: version
    uses: ./.github/workflows/build-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      prerelease: true
