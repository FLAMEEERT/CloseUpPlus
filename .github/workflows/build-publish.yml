name: Build & Publish

# Reusable unsigned distribution pipeline shared by stable and manual beta
# releases. CloseUpPlus currently has no Apple Developer identity, so each app
# receives only an ad-hoc signature and is not notarized. The release is created
# as a draft and becomes public only after every asset is present.
on:
  workflow_call:
    inputs:
      version:
        description: Display version, for example 1.0.0
        required: true
        type: string
      tag:
        description: Git tag to create on the built commit, for example v1.0.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Build & publish
    runs-on: macos-15
    env:
      SCHEME: CloseUp
      APP_NAME: CloseUpPlus
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Stamp build number
        id: stamp
        run: echo "build=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Generate project
        run: xcodegen generate

      - name: Build and package both architectures
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ steps.stamp.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p build/dist

          for ARCH in arm64 x86_64; do
            DERIVED="build/DerivedData-$ARCH"
            xcodebuild -scheme "$SCHEME" -configuration Release \
              -derivedDataPath "$DERIVED" \
              -destination 'generic/platform=macOS' \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              ARCHS="$ARCH" ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
              build | xcbeautify

            APP="$DERIVED/Build/Products/Release/$APP_NAME.app"
            test -d "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -q '^Signature=adhoc$'
            test "$(lipo -archs "$APP/Contents/MacOS/$APP_NAME")" = "$ARCH"
            test "$(lipo -archs "$APP/Contents/Frameworks/Sparkle.framework/Sparkle")" = "$ARCH"

            ZIP="build/dist/$APP_NAME-$VERSION-$ARCH.zip"
            DMG="build/dist/$APP_NAME-$VERSION-$ARCH.dmg"
            ditto -c -k --keepParent "$APP" "$ZIP"
            bash scripts/make-dmg.sh "$APP" "$DMG" "$APP_NAME"
            unzip -tq "$ZIP"
            hdiutil imageinfo "$DMG" >/dev/null
          done

          (cd build/dist && shasum -a 256 ./*) > build/SHA256SUMS.txt
          (cd build/dist && shasum -a 256 -c ../SHA256SUMS.txt)

      - name: Generate release notes
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PREV="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fvx "$TAG" | head -n1 || true)"
          {
            echo "## CloseUpPlus $VERSION"
            echo
            echo "> This build is ad-hoc signed and is not Apple-notarized. On first launch, right-click CloseUpPlus and choose Open, or allow it in System Settings → Privacy & Security."
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..HEAD"
            else
              git log --no-merges --pretty='- %s'
            fi
          } > build/release-notes.md

      - name: Create and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(
            --target "$GITHUB_SHA"
            --title "CloseUpPlus $VERSION"
            --notes-file build/release-notes.md
            --draft
          )
          if [ "$PRERELEASE" = true ]; then ARGS+=(--prerelease); fi

          ASSETS=(
            "build/dist/$APP_NAME-$VERSION-arm64.zip"
            "build/dist/$APP_NAME-$VERSION-x86_64.zip"
            "build/dist/$APP_NAME-$VERSION-arm64.dmg"
            "build/dist/$APP_NAME-$VERSION-x86_64.dmg"
            build/SHA256SUMS.txt
          )

          if EXISTING="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            test "$(jq -r .isDraft <<<"$EXISTING")" = true
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
            test "$TAG_COMMIT" = "$GITHUB_SHA"
            gh release edit "$TAG" \
              --title "CloseUpPlus $VERSION" \
              --notes-file build/release-notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ARGS[@]}" "${ASSETS[@]}"
          fi

          RELEASE_JSON="$(gh release view "$TAG" --json isDraft,assets)"
          test "$(jq -r .isDraft <<<"$RELEASE_JSON")" = true
          EXPECTED_ASSETS="$(printf '%s\n' \
            "$APP_NAME-$VERSION-arm64.zip" \
            "$APP_NAME-$VERSION-x86_64.zip" \
            "$APP_NAME-$VERSION-arm64.dmg" \
            "$APP_NAME-$VERSION-x86_64.dmg" \
            SHA256SUMS.txt | sort)"
          ACTUAL_ASSETS="$(jq -r '.assets[].name' <<<"$RELEASE_JSON" | sort)"
          test "$ACTUAL_ASSETS" = "$EXPECTED_ASSETS"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
